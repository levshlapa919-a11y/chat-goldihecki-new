<!doctype html>
<html lang="ru">    
<head>    
<meta charset="utf-8">    
<meta name="viewport" content="width=device-width,initial-scale=1">    
<title>Goldihecki DM - Debug</title>    
<style>    
body{margin:0;background:#0b0c0e;color:#f4f1e8;font:16px system-ui,sans-serif;padding:20px}    
.box{background:#141619;border:1px solid #443b28;border-radius:12px;padding:20px;max-width:400px;margin:auto}    
button{width:100%;padding:14px;background:#e5bd58;color:#17130a;border:0;border-radius:8px;font-weight:bold;font-size:16px;margin-top:15px;cursor:pointer}    
.log{margin-top:15px;padding:10px;background:#000;color:#79d7a4;font-family:monospace;font-size:13px;border-radius:6px;min-height:50px;white-space:pre-wrap}    
</style>    
</head>    
<body>    
<div class="box">    
    <h2>Тест кнопок</h2>    
    <p>Если этот тест работает, значит телефон и браузер исправны, и проблема была в старом коде.</p>    
    <button id="testBtn">Нажми на меня!</button>    
    <div id="logArea" class="log">Ожидание нажатия…</div>    
</div>    

<script>
(function(){
    var btn = document.getElementById('testBtn');
    var log = document.getElementById('logArea');

    function triggerAction(e) {
        e.preventDefault();
        log.textContent = 'Кнопка успешно нажата! Время: ' + new Date().toLocaleTimeString();
        console.log('Button clicked successfully');
    }

    btn.addEventListener('click', triggerAction);
    btn.addEventListener('touchstart', triggerAction, {passive: false});
})();
</script>    
</body>    
</html>
