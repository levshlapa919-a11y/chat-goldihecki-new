<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goldihecki DM, YZITK</title>
<style>
:root{--bg:#0b0c0e;--panel:#141619;--line:#303238;--gold:#e5bd58;--gold2:#f4d985;--text:#f4f1e8;--muted:#a3a6ad;--green:#79d7a4;--red:#ff9292}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#211f18,#0b0c0e 55%);color:var(--text);font:15px/1.45 system-ui,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}.muted{color:var(--muted)}.gold{color:var(--gold)}.small{font-size:12px}
.wrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth{width:min(440px,100%);background:var(--panel);border:1px solid #443b28;border-radius:22px;padding:26px;box-shadow:0 22px 90px #0008}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logoMark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#f3d77c,#b88a2c);display:grid;place-items:center;color:#16130a;font-weight:900;font-size:21px;flex-shrink:0}.logo h1{font-size:21px;margin:0}.logo p{margin:2px 0 0;color:var(--muted);font-size:12px}
.tabs{display:flex;background:#0c0d0f;padding:4px;border:1px solid var(--line);border-radius:11px;margin:20px 0 18px}.tabs button{background:transparent;border:0;color:var(--muted);border-radius:8px;padding:10px;flex:1;touch-action:manipulation;font-weight:600}.tabs button.active{background:#302a1c;color:var(--gold2)}
label{display:block;font-size:12px;color:#c7c4bc;margin:13px 0 6px}
.field,.search{width:100%;background:#0d0f11;border:1px solid #34373c;border-radius:10px;padding:12px;color:var(--text);outline:none}.field:focus,.search:focus{border-color:var(--gold)}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 13px;font-weight:650;touch-action:manipulation}.btnGold{background:linear-gradient(120deg,#f0d47e,#d3a842);color:#17130a}.btnDark{background:#24272c;color:var(--text);border-color:#393d43}.btnFull{width:100%;margin-top:18px;padding:12px}
.notice{font-size:12px;color:var(--muted);margin-top:12px;min-height:18px;white-space:pre-wrap}.notice.error{color:var(--red)}
.app{height:100dvh;min-height:560px;max-width:1500px;margin:auto;padding:14px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.side,.main{background:var(--panel);border:1px solid #2d2c27;border-radius:16px;min-height:0;overflow:hidden}.side{display:flex;flex-direction:column}.sideHead{padding:16px;border-bottom:1px solid var(--line)}.headRow{display:flex;align-items:center;justify-content:space-between;gap:8px}.me{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.avatar{height:40px;width:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#473b20,#80652e);color:#ffe39a;font-weight:800;overflow:hidden}
.sideTools{padding:12px;display:grid;gap:9px}.sectionLabel{font-size:10px;letter-spacing:1.4px;font-weight:800;color:#9b8a62;text-transform:uppercase;padding:5px 14px 7px}.people{overflow:auto;min-height:0;flex:1;padding:0 8px 10px}
.person{display:flex;gap:10px;align-items:center;width:100%;padding:11px 10px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);text-align:left;margin-bottom:4px}.person:hover{background:#222429}.person.active{background:#302a1c;border-color:#594a28}.personText{min-width:0;flex:1}.personName{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.personSub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;display:block}
.sideFoot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}.sideFoot .btn{font-size:12px;padding:8px 10px}
.main{display:flex;flex-direction:column;position:relative}.mainTop{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:76px;position:relative}.chatIdentity{display:flex;align-items:center;gap:11px;min-width:0}.chatIdentity h2{font-size:16px;margin:0;overflow-wrap:anywhere}.chatIdentity p{font-size:12px;color:var(--muted);margin:3px 0 0}
.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:0}.empty{margin:auto;text-align:center;max-width:340px;color:var(--muted);padding:25px}.emptyIcon{font-size:34px;color:#826b33;margin-bottom:12px}.empty h3{color:#e4d8b7;font-size:17px;margin:0 0 5px}.empty p{margin:0;font-size:13px}
.msg{display:flex;flex-direction:column;max-width:76%;align-self:flex-start;gap:4px}.msg.mine{align-self:flex-end}.bubble{padding:11px 14px;border-radius:15px 15px 15px 4px;background:#25282d;border:1px solid #34373c;overflow-wrap:anywhere;white-space:pre-wrap}.msg.mine .bubble{background:#3a301c;border-color:#68552b;border-radius:15px 15px 4px 15px}.msgMeta{font-size:10px;color:#999a9c;padding:0 4px;display:flex;gap:7px;justify-content:flex-end}
.composer{border-top:1px solid var(--line);padding:13px;display:flex;align-items:flex-end;gap:9px;background:#121416}.composer textarea{min-height:44px;max-height:140px;resize:vertical;flex:1;background:#0d0f11;border:1px solid #34373c;border-radius:10px;padding:11px;color:var(--text);outline:none}.composer .btn{height:44px;min-width:76px}
.connection{border-top:1px solid #292b2f;padding:7px 13px;color:#8c9097;font-size:10px;display:flex;justify-content:space-between}
.mobileBack{display:none}
@media(max-width:760px){.app{padding:0;gap:0;grid-template-columns:1fr;height:100dvh}.side,.main{border-radius:0}.side{grid-column:1;grid-row:1}.main{grid-column:1;grid-row:1;display:none}.app.inChat .side{display:none}.app.inChat .main{display:flex}.mobileBack{display:inline-flex}}
</style>
</head>
<body>

<div id="authScreen" class="wrap">
<section class="auth">
<div class="logo"><div class="logoMark">G</div><div><h1>Goldihecki <span class="gold">DM</span></h1><p>Личные сообщения и чаты</p></div></div>
<div class="tabs"><button id="loginTab" class="active" type="button">Вход</button><button id="signupTab" type="button">Регистрация</button></div>
<form id="authForm">
<div id="signupFields" class="hidden">
<label for="regUsername">Юзернейм *</label><input class="field" id="regUsername" placeholder="например, gold_user" autocomplete="username">
</div>
<label for="email">Электронная почта</label><input class="field" id="email" type="email" required autocomplete="email" placeholder="you@example.com">
<label for="password">Пароль</label><input class="field" id="password" type="password" required minlength="6" placeholder="Минимум 6 символов">
<button id="authSubmit" class="btn btnGold btnFull" type="submit">Войти в аккаунт</button>
</form>
<div id="authNotice" class="notice">Готов к работе</div>
</section>
</div>

<div id="app" class="app hidden">
<aside class="side">
<div class="sideHead"><div class="headRow"><div class="logo" style="margin:0"><div class="logoMark" style="width:37px;height:37px;font-size:18px">G</div><div><h1 style="font-size:17px">Goldihecki <span class="gold">DM</span></h1></div></div></div><div id="myLabel" class="me">Загрузка профиля…</div></div>
<div class="sideTools"><input id="userSearch" class="search" placeholder="Поиск по @юзернейму…"><button id="searchBtn" class="btn btnGold" type="button">Найти человека</button></div>
<div class="sectionLabel">Мои чаты</div>
<div id="peopleList" class="people"><div class="empty"><p>Нет чатов</p></div></div>
<div class="sideFoot"><button id="signOutBtn" class="btn btnDark" type="button" style="width:100%">Выйти из аккаунта</button></div>
</aside>
<main class="main">
<header class="mainTop">
<div class="chatIdentity"><button id="mobileBack" class="btn btnDark mobileBack" type="button">‹</button><div class="avatar" id="chatAvatar">✉</div><div><h2 id="chatTitle">Выбери чат</h2><p id="chatSubtitle">Ищи людей по юзернейму слева</p></div></div>
</header>
<section id="messages" class="messages"><div class="empty"><div class="emptyIcon">✦</div><h3>Диалог не выбран</h3><p>Выберите собеседника из списка слева.</p></div></section>
<form id="composer" class="composer"><textarea id="messageInput" rows="1" placeholder="Напишите сообщение..." disabled></textarea><button id="sendBtn" class="btn btnGold" type="submit" disabled>Отправить</button></form>
<div class="connection"><span id="connectionState">Подключено</span><span>Goldihecki DM</span></div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var URL = 'https://bkzvoktchnxidoeaklca.supabase.co';
var KEY = 'sb_publishable_KiTpU3ATB2S7g4YCtac2fw_34-spY_p';
var db = window.supabase.createClient(URL, KEY);

function $(id){ return document.getElementById(id); }

var mode = 'login';
var currentUser = null;
var activeUser = null;
var activeConv = null;

function setMode(m) {
    mode = m;
    $('loginTab').classList.toggle('active', m === 'login');
    $('signupTab').classList.toggle('active', m === 'signup');
    $('signupFields').classList.toggle('hidden', m === 'login');
    $('authSubmit').textContent = m === 'login' ? 'Войти в аккаунт' : 'Создать аккаунт';
}

$('loginTab').onclick = function() { setMode('login'); };
$('signupTab').onclick = function() { setMode('signup'); };

$('authForm').onsubmit = function(e) {
    e.preventDefault();
    var email = $('email').value.trim();
    var password = $('password').value;
    $('authNotice').textContent = 'Выполняется запрос…';
    $('authNotice').className = 'notice';

    if (mode === 'login') {
        db.auth.signInWithPassword({email: email, password: password}).then(function(res) {
            if (res.error) throw res.error;
            currentUser = res.data.user;
            initApp();
        }).catch(function(err) {
            $('authNotice').textContent = 'Ошибка входа: ' + err.message;
            $('authNotice').className = 'notice error';
        });
    } else {
        var username = $('regUsername').value.trim().toLowerCase();
        if (!username) {
            $('authNotice').textContent = 'Введите юзернейм!';
            $('authNotice').className = 'notice error';
            return;
        }
        db.auth.signUp({
            email: email,
            password: password,
            options: { data: { username: username, display_name: username } }
        }).then(function(res) {
            if (res.error) throw res.error;
            $('authNotice').textContent = 'Аккаунт создан! Теперь войдите.';
        }).catch(function(err) {
            $('authNotice').textContent = 'Ошибка регистрации: ' + err.message;
            $('authNotice').className = 'notice error';
        });
    }
};

function initApp() {
    $('authScreen').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('myLabel').textContent = currentUser.email;
    loadUsers();
}

function loadUsers() {
    db.from('profiles').select('*').then(function(res) {
        if (res.error) return;
        var list = res.data || [];
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var p = list[i];
            if (p.user_id === currentUser.id) continue;
            html += '<button class="person" data-uid="' + p.user_id + '" type="button">' +
                '<span class="avatar">' + (p.username ? p.username[0].toUpperCase() : '?') + '</span>' +
                '<span class="personText"><span class="personName">' + (p.display_name || p.username) + '</span><span class="personSub">@' + p.username + '</span></span>' +
                '</button>';
        }
        $('peopleList').innerHTML = html || '<div class="empty"><p>Нет других пользователей</p></div>';

        var btns = $('peopleList').querySelectorAll('[data-uid]');
        for (var b = 0; b < btns.length; b++) {
            btns[b].onclick = function(uid) {
                return function() { selectUser(uid); };
            }(btns[b].getAttribute('data-uid'));
        }
    });
}

function selectUser(uid) {
    db.from('profiles').select('*').eq('user_id', uid).single().then(function(res) {
        if (res.error) return;
        activeUser = res.data;
        $('chatTitle').textContent = activeUser.display_name || activeUser.username;
        $('chatSubtitle').textContent = '@' + activeUser.username;
        $('chatAvatar').textContent = activeUser.username[0].toUpperCase();
        $('app').classList.add('inChat');
        $('messageInput').disabled = false;
        $('sendBtn').disabled = false;

        // Создаем или получаем диалог
        db.rpc('get_or_create_dm', {p_other_user: uid}).then(function(r) {
            if (r.error) throw r.error;
            activeConv = r.data;
            loadMessages();
        });
    });
}

function loadMessages() {
    if (!activeConv) return;
    db.from('direct_messages').select('*').eq('conversation_id', activeConv).order('created_at', {ascending: true}).then(function(res) {
        if (res.error) return;
        var msgs = res.data || [];
        var html = '';
        for (var i = 0; i < msgs.length; i++) {
            var m = msgs[i];
            var mine = (m.sender_id === currentUser.id);
            html += '<article class="msg ' + (mine ? 'mine' : '') + '"><div class="bubble">' + m.content + '</div><div class="msgMeta"><span>' + new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + '</span></div></article>';
        }
        $('messages').innerHTML = html || '<div class="empty"><h3>Нет сообщений</h3><p>Напишите первое сообщение ниже.</p></div>';
        $('messages').scrollTop = $('messages').scrollHeight;
    });
}

$('composer').onsubmit = function(e) {
    e.preventDefault();
    var txt = $('messageInput').value.trim();
    if (!txt || !activeConv) return;
    db.from('direct_messages').insert({
        conversation_id: activeConv,
        sender_id: currentUser.id,
        content: txt
    }).then(function(res) {
        if (res.error) throw res.error;
        $('messageInput').value = '';
        loadMessages();
    });
};

$('mobileBack').onclick = function() { $('app').classList.remove('inChat'); };
$('signOutBtn').onclick = function() { db.auth.signOut().then(function(){ window.location.reload(); }); };

// Проверка сессии при открытии
db.auth.getSession().then(function(res) {
    if (res.data && res.data.session) {
        currentUser = res.data.session.user;
        initApp();
    }
});
})();
</script>
</body>
</html>
